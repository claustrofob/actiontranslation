<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} – {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.title }}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description | default: page.title }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body class="legal">
  <header class="legal-bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/icon.png' | relative_url }}" alt="" width="36" height="36">
      <span>{{ site.title }}</span>
    </a>
  </header>
  <main class="legal-text">
    <article>
{{ content }}
    </article>
  </main>
</body>
</html>
